
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mars EVA Pathfinder | 3D Explorer</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topbar">
        <div>
            <h1>MARS EVA PATHFINDER</h1>
            <p>3D Terrain Explorer & EVA Route Simulation</p>
        </div>

        <div class="topbar-badge">
            MARS 3D EXPLORER
        </div>
    </header>

    <main class="explorer-layout">

        <aside class="sidebar">

            <h2>MISSION CONTROL</h2>

            <div class="control-group">
                <h3>Terrain Layers</h3>

                <button id="photoLayerBtn" class="active">
                    Mars Photo
                </button>

                <button id="heightLayerBtn">
                    Elevation
                </button>

                <button id="thermalLayerBtn">
                    Thermal
                </button>
            </div>

            <div class="control-group">
                <h3>EVA Route</h3>

<div class="route-point-controls">

    <button id="select3DStartBtn">
        📍 Select Start on Terrain
    </button>

    <button id="select3DEndBtn">
        🏁 Select Destination on Terrain
    </button>

    <p id="routePointStatus">
        Choose a start point and destination.
    </p>

    <button id="calculate3DRouteBtn">
        Calculate EVA Routes
    </button>

</div>


                <label for="routeSelect">Select Route</label>

                <select id="routeSelect">
                    <option value="safest">Safest Route</option>
                    <option value="fastest">Fastest Route</option>
                    <option value="energy">Energy-Efficient Route</option>
                </select>

                <button id="playRouteBtn">
                    ▶ Play Route
                </button>

                <button id="pauseRouteBtn">
                    ⏸ Pause
                </button>

                <button id="resetCameraBtn">
                    Reset Camera
                </button>
            </div>

            <div class="control-group">
                <h3>Camera Speed</h3>

                <input
                    type="range"
                    id="speedSlider"
                    min="1"
                    max="5"
                    value="2"
                >
            </div>

            <div class="control-group">
                <h3>Mission Status</h3>

                <p id="missionStatus">
                    Initializing 3D terrain...
                </p>
            </div>

        </aside>

        <section class="viewer-section">
            <div id="terrain3d"></div>

            <div class="viewer-hint">
                Drag to rotate • Scroll to zoom • Right-drag to pan
            </div>
        </section>

    </main>

    
<script type="importmap">
{
    "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.1/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.1/examples/jsm/"
    }
}
</script>

<script type="module" src="script.js"></script>


</body>
</html>
